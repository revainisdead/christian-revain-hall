# Base services shared by every environment. Not used on its own:
#   dev:  docker compose up                      (auto-merges docker-compose.override.yml)
#   prod: set COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml in the server's .env
#         (or PROD=1 docker-scripts/<cmd> for a one-off)
services:
    server:
        build:
            context: .
            dockerfile: dockerfiles/Dockerfile-server
        depends_on:
            db:
                condition: service_healthy
        env_file: .env
        working_dir: /srv/app/server
        user: ${UID:-1000}
        environment:
            # username:password@{net alias}/{db name}
            DATABASE_URL: postgres://crhall:crhall@crh-db-net/crhall
        volumes:
            - ".:/srv/app:delegated"
            - "static-volume:/srv/app/static"
        networks:
            app_net:
                ipv4_address: 172.32.1.1
                aliases:
                    - crh-server-net
    client:
        build:
            context: .
            dockerfile: dockerfiles/Dockerfile-client
        env_file: .env
        working_dir: /srv/app/client
        volumes:
            - "./client:/srv/app/client:delegated"
            # Container-only node_modules (keeps the host's client/ bind mount from hiding it).
            # Filled from the image on first use; `make dev/update/rebuild-env` delete it after a
            # build so new npm packages show up.
            - "client-node-modules:/srv/app/client/node_modules"
            - "static-volume:/srv/app/static"
        networks:
            app_net:
                ipv4_address: 172.32.1.2
                aliases:
                    - crh-client-net
    db:
        build:
            context: .
            dockerfile: dockerfiles/Dockerfile-db
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U crhall"]
            interval: 2s
            timeout: 5s
            retries: 10
        environment:
            # This entry point is run by the docker hub postgres image to create and run the database.
            # https://github.com/docker-library/postgres/blob/master/10/alpine/docker-entrypoint.sh
            POSTGRES_USER: crhall
            POSTGRES_PASSWORD: crhall
            POSTGRES_DB: crhall
            PGDATA: /var/lib/postgresql/data/pgdata
        expose:
            - 5432
        volumes:
            # Must contain PGDATA. The postgres image declares /var/lib/postgresql/data as an
            # anonymous volume; mounting the named volume there keeps the data in db-volume,
            # where container recreation and volume refreshes never touch it.
            - "db-volume:/var/lib/postgresql/data"
        networks:
            app_net:
                ipv4_address: 172.32.1.3
                aliases:
                    - crh-db-net

volumes:
    db-volume:
        name: christian-hall_db-volume
    static-volume:
        name: christian-hall_static-volume
    client-node-modules:
        name: christian-hall_client-node-modules

networks:
    app_net:
        name: crh-net
        driver: bridge
        ipam:
            config:
                - subnet: 172.32.0.0/16
        external: ${EXTERNAL_NET:-false}
