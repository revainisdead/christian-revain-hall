# Production nginx for christian-revain-hall.com (docker-compose.prod.yml).
# TLS certs: /etc/nginx/certs/* -> Let's Encrypt (see 40-ssl-cert.sh, `make certs-issue`).

# :80 answers Let's Encrypt's challenge; everything else goes to https on the bare domain.
server {
    listen 80;
    server_name christian-revain-hall.com www.christian-revain-hall.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://christian-revain-hall.com$request_uri;
    }
}

# https://www -> https://bare domain
server {
    listen 443 ssl;
    http2 on;
    server_name www.christian-revain-hall.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 301 https://christian-revain-hall.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name christian-revain-hall.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Browsers remember to use https for a year. (Add includeSubDomains/preload only when sure.)
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Django: API, admin, DRF browsable-API login.
    location ~ ^/(api|admin|api-auth)/ {
        proxy_pass http://crh-server-net:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django static files (admin, DRF), written by collectstatic into the shared static volume.
    location /static/ {
        alias /srv/app/static/;
    }
}
