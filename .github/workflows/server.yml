name: Server CI

on:
  push:
    branches: [master, develop]
    paths:
      - "server/**"
      - "setup.cfg"
      - ".github/workflows/server.yml"
  pull_request:
    branches: [master, develop]
    paths:
      - "server/**"
      - "setup.cfg"
      - ".github/workflows/server.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Same Python as dockerfiles/Dockerfile-server.
    container: python:3.8

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crhall
          POSTGRES_PASSWORD: crhall
          POSTGRES_DB: crhall
        options: >-
          --health-cmd "pg_isready -U crhall"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgres://crhall:crhall@postgres:5432/crhall
      PIP_ROOT_USER_ACTION: ignore
      SECRET_KEY: ci-only-not-secret

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-tools "setuptools<70"
          pip-compile requirements.in --output-file requirements.txt
          pip-compile dev-requirements.in --output-file dev-requirements.txt
          pip-sync requirements.txt dev-requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test

      - name: Flake8 (report only)
        # Existing code has outstanding lint findings; make this blocking once cleaned up.
        continue-on-error: true
        working-directory: .
        run: flake8 server --config setup.cfg
