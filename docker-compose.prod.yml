# Production overrides, merged on top of docker-compose.yml.
# On the prod server put this in .env so plain commands use it:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml
services:
    server:
        environment:
            DEBUG: 'false'
        command: sh -c "./manage.py collectstatic --noinput && gunicorn blunderproof.wsgi:application --bind 0.0.0.0:8001"
        # Reachable only from nginx on the internal network; never published on the host.
        expose:
            - 8001
    client:
        # One-shot build: writes client/dist/spa (bind-mounted), which nginx serves.
        command: npm run build
        restart: "no"
    nginx:
        build:
            context: .
            dockerfile: dockerfiles/Dockerfile-nginx
        command: nginx -c /etc/nginx/nginx.conf -g 'daemon off;'
        working_dir: /srv/app/nginx
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            client:
                condition: service_completed_successfully
            server:
                condition: service_started
        volumes:
            - "./client/dist/spa:/usr/share/nginx/html:ro"
            - "static-volume:/srv/app/static:ro"
            - "letsencrypt:/etc/letsencrypt:ro"
            - "certbot-www:/var/www/certbot:ro"
        networks:
            app_net:
                ipv4_address: 172.32.1.4
                aliases:
                    - crh-nginx-net
    # Let's Encrypt client. Not started by `up` (profile); used via `make certs-issue` / `make certs-renew`.
    certbot:
        image: certbot/certbot:latest
        profiles: ["tools"]
        env_file: .env
        volumes:
            - "letsencrypt:/etc/letsencrypt"
            - "certbot-www:/var/www/certbot"

volumes:
    letsencrypt:
        name: christian-hall_letsencrypt
    certbot-www:
        name: christian-hall_certbot-www
