server {

    listen 80;

    root /usr/share/nginx/html;

    server_name christian-revain-hall.com;

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Django: API, admin, DRF browsable-API login.
    location ~ ^/(api|admin|api-auth)/ {
        proxy_pass http://crh-server-net:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django static files (admin, DRF), written by collectstatic into the shared static volume.
    location /static/ {
        alias /srv/app/static/;
    }
}
